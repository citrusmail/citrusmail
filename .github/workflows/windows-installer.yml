name: windows-installer

# Builds the Windows installer (CitrusMail-<version>-x64.exe) on a Windows
# runner, for attaching to a release. Run it by hand from the Actions tab or
# `gh workflow run windows-installer.yml`; the installer is the run's artifact
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build the installer
        run: pnpm run desktop:build:win --x64
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload the installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: dist-desktop/*-x64.exe
          if-no-files-found: error
