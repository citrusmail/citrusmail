name: release

# Builds every installer when a version tag is pushed and attaches them to a
# draft GitHub release, with the update feed files installed apps read
# (latest-mac.yml, latest.yml, latest-linux.yml and the .blockmap files, so
# updates download only what changed). Publish the draft to ship it.
#
#   pnpm version patch        # bumps package.json and desktop/package.json, tags v0.1.2
#   git push --follow-tags
#
# Mac builds are signed and notarized from these repository secrets:
#   MAC_CERTIFICATE           Developer ID Application certificate, .p12 as base64
#   MAC_CERTIFICATE_PASSWORD  its password
#   APPLE_API_KEY             App Store Connect API key (.p8 contents), for notarization
#   APPLE_API_KEY_ID          the key's id
#   APPLE_API_ISSUER          the issuer id
# Without them the Mac build is ad-hoc signed and can't update itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac
            os: macos-latest
            args: --mac --arm64 --x64
          - name: Windows
            os: windows-latest
            args: --win --x64 --arm64
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "Tag ${GITHUB_REF_NAME} but package.json says ${version}"; exit 1; }

      - name: Build the app
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Apple notarization key
        if: matrix.name == 'Mac' && env.APPLE_API_KEY != ''
        shell: bash
        run: |
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

      - name: Build and publish the installers
        shell: bash
        run: pnpm exec electron-builder --projectDir desktop --config electron-builder.config.cjs ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=6144
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Keep the installers as run artifacts too
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.name }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.yml
            dist-desktop/*.blockmap
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download the release assets and attach SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern '*.dmg' --pattern '*.zip' --pattern '*.exe' --pattern '*.AppImage' --pattern '*.deb'
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" ../SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
